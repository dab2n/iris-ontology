<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IRIS · 회의 온톨로지</title>
<style>
:root{
  --bg:#eef1f5; --panel:#f6f8fb; --card:#fff; --line:#dfe4ec; --line2:#e9edf3;
  --ink:#1e232c; --ink2:#434b58; --dim:#7b8494; --faint:#a3abb8;
  --blue:#3f63c9; --violet:#6a55c8; --cyan:#1d8ea0;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:SFKR,-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;
  color:var(--ink);background:var(--bg);letter-spacing:-.02em;font-size:13px;-webkit-font-smoothing:antialiased;
  display:grid;grid-template-columns:392px minmax(0,1fr);overflow:hidden}
button,input{font:inherit;color:inherit;letter-spacing:inherit;border:0;background:none}
button{cursor:pointer}
[hidden]{display:none!important}

/* ── 왼쪽: 사람이 읽는 답 ─────────────────────
   색·글자·모서리는 IRIS 웹(meetnote docs/index.html)의 디자인 시스템을 그대로 쓴다.
   토큰을 .side 안에만 다시 정의해 설계 보기 쪽은 건드리지 않는다. */
.side{--bg:#fcfcfe;--card:#f2f5fa;--card2:#f5f6f8;--chip:#e4eaf2;--line:#dee0e6;--line2:#d7dff1;
  --ink:#050a0a;--ink2:#3b3b3b;--navy:#2d3b48;--dim:#757575;--dim2:#a3a3a3;--dark:#222a2a;--blue:#4b87e9;
  display:flex;flex-direction:column;min-height:0;background:#fcfcfe;border-right:1px solid #eef0f4;
  font:400 14px/1.5 SFKR,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  color:var(--ink);letter-spacing:-.01em;word-break:keep-all}
.top{padding:20px 22px 18px}
.brand{display:flex;align-items:center;gap:8px}
.brand b{font-size:17px;font-weight:700;letter-spacing:.04em}
.brand span{font-size:13px;color:var(--dim2);font-weight:500}
#pclose{margin-left:auto;width:26px;height:26px;border-radius:99px;color:var(--dim2);font-size:11px;line-height:1}
#pclose:hover{background:var(--card);color:var(--navy)}
.mt{margin-top:14px;font-size:20px;font-weight:700;letter-spacing:-.4px;line-height:1.3}
.mm{margin-top:5px;font-size:12px;color:var(--dim2);letter-spacing:-.1px;font-variant-numeric:tabular-nums}

.tabs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:8px 12px 0;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.tabs em{font:650 9.5px var(--mono);font-style:normal;letter-spacing:.08em;color:var(--dim);text-transform:uppercase;margin-right:4px}
.tab{height:24px;padding:0 9px;border-radius:5px;font-size:11.5px;font-weight:650;color:var(--ink2);border:1px solid var(--line);background:var(--card)}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tabs .sep{width:1px;background:var(--line);margin:3px 3px}

.scroll{flex:1;overflow:auto;min-height:0;padding:0 22px 40px;scrollbar-width:thin}

/* 답 한 장 — 질문 / 답 / 짚은 것 / 원 발화 네 덩어리가 간격으로 갈린다 */
.box{padding-top:4px}
.box .bq{display:flex;gap:10px;align-items:flex-start;padding-bottom:16px;border-bottom:1px solid #eef0f4}
.box .bq b{flex:1;font-size:18px;font-weight:700;letter-spacing:-.3px;line-height:1.4}
.box .x{flex:none;width:26px;height:26px;border-radius:99px;color:var(--dim2);font-size:13px;line-height:1}
.box .x:hover{background:var(--card);color:var(--navy)}
/* 찾는 중 — 단계를 쪼개 보여 주지 않는다. 가는 줄 하나와 한 마디면 된다 */
.steps{height:2px;margin-top:16px;border-radius:2px;background:var(--line2);overflow:hidden}
.steps:after{content:"";display:block;height:100%;width:38%;border-radius:2px;background:var(--blue);
  animation:sweep 1.25s var(--ease,cubic-bezier(.3,0,.2,1)) infinite}
@keyframes sweep{from{transform:translateX(-110%)}to{transform:translateX(320%)}}
.stepl{margin-top:9px;font-size:12px;color:var(--dim2);font-variant-numeric:tabular-nums}
.ans{margin-top:18px;display:grid;gap:6px}
.ans div{font-size:14px;line-height:1.65;color:var(--ink2)}
/* 답 — 사람이 읽는 문장이 먼저, 가장 크게 */
.lead{margin-top:20px;font-size:15px;line-height:1.75;color:var(--ink)}
.lead p+p{margin-top:12px}
/* 짚은 것 — 한 줄짜리 카드로 끊어 읽는 속도를 바꾼다 */
.pts{margin-top:22px;display:grid;gap:8px;list-style:none}
.pts li{padding:13px 16px;border-radius:16px;background:var(--card2);box-shadow:0 0 0 1px #eef0f4;
  font-size:14px;line-height:1.6;color:var(--ink2)}
.pts li em{display:block;margin-bottom:4px;font-size:11.5px;font-weight:600;font-style:normal;color:var(--navy);letter-spacing:-.1px}
.more{margin-top:26px}
.more summary{display:flex;align-items:center;gap:6px;cursor:pointer;list-style:none;
  font-size:13px;font-weight:600;color:var(--dim)}
.more summary:hover{color:var(--navy)}
.more summary::-webkit-details-marker{display:none}
.more summary::before{content:"▸";font-size:10px;color:var(--dim2)}
.more[open] summary::before{content:"▾"}
.more>:not(summary){margin-top:12px}
.hd{margin:22px 0 10px;font-size:13px;font-weight:600;color:var(--dim)}
.path{display:grid;gap:2px}
.path div{padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.5;color:var(--ink2);cursor:pointer}
.path div:hover{background:var(--card)}
.path code{font:600 11px var(--mono);color:var(--blue);padding:0 4px;letter-spacing:-.02em}
.path code.inf{color:#8a6fd1}
.src{display:grid;gap:8px}
.q{padding:13px 16px;border-radius:16px;background:var(--card);cursor:pointer;transition:background .18s}
.q:hover{background:var(--chip)}
.q .qm{display:flex;align-items:baseline;gap:8px;font-size:13.5px;font-weight:600;color:var(--navy)}
.q .qm span{font-size:12px;font-weight:400;color:var(--dim2);font-variant-numeric:tabular-nums}
.q .qm b{font-weight:600}
.q p{margin-top:5px;font-size:13.5px;line-height:1.6;color:var(--ink2)}
.q p mark{background:#dcecff;color:inherit;border-radius:2px;padding:0 1px}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:99px;
  background:var(--chip);color:var(--navy);font-size:11px;font-weight:600;letter-spacing:-.1px}
.badge.exp{background:#e3edfd;color:#2f63b8}
.badge.inf{background:#eee9fb;color:#6a55c8}
.person-meta{margin-top:14px;padding:13px 16px;border-radius:16px;background:var(--card2);
  box-shadow:0 0 0 1px #eef0f4;font-size:13.5px;line-height:1.7;color:var(--ink2)}
.person-meta small{color:var(--dim2)}
.empty{margin-top:2px;font-size:13.5px;color:var(--dim2);line-height:1.75}

/* 결정 · 조건부 · 미결 · 업무 */
.segs{display:flex;gap:0;margin:14px 12px 0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--card)}
.segs button{flex:1;height:30px;font-size:11.5px;font-weight:650;color:var(--ink2);border-right:1px solid var(--line)}
.segs button:last-child{border-right:0}
.segs button b{font:600 10px var(--mono);color:var(--faint);margin-left:4px;letter-spacing:-.02em}
.segs button.on{background:#e8ecf3;color:var(--ink)}
.segs button.on b{color:var(--ink2)}
.cards{display:grid;gap:6px;padding:8px 12px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:9px 11px;cursor:pointer}
.card:hover{border-color:#c5cddb}
.card.sel{border-color:#8aa0e6;box-shadow:0 0 0 1px #8aa0e6}
.card .k{font:650 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.card h4{margin-top:3px;font-size:13px;font-weight:720;line-height:1.4}
.card .t{margin-top:2px;font-size:11.5px;color:var(--ink2);line-height:1.5}
.card .m{margin-top:5px;font:500 10px var(--mono);color:var(--dim);letter-spacing:-.02em}
.chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.chip{font-size:10.5px;font-weight:650;padding:1px 6px;border-radius:3px;background:#eef1f6;color:var(--ink2)}
.k.Decision{color:#3d4a66}.k.Conditional{color:var(--violet)}.k.Open{color:#8a7bb8}.k.Action{color:var(--cyan)}

.skel{margin-top:20px;display:grid;gap:11px}
.skel i{display:block;height:13px;border-radius:7px;
  background:linear-gradient(90deg,#eef1f6 25%,#f8fafc 37%,#eef1f6 63%);background-size:400% 100%;
  animation:shimmer 1.4s ease infinite}
.skel i:nth-child(2){width:86%;animation-delay:.12s}
.skel i:nth-child(3){width:58%;animation-delay:.24s}
@keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}
@media (prefers-reduced-motion:reduce){.steps:after,.skel i{animation:none}}

/* ── 오른쪽: AI 내부 관계 구조 ───────────────────── */
.stage{position:relative;background:radial-gradient(ellipse 100% 95% at 50% 45%,#5B9CDD 0%,#5B9CDD 32%,#94BCE5 52%,#B3DBF0 74%,#DEF5FC 85%,#E7EEF2 95%,#FFFFFF 100%);
  min-width:0;overflow:hidden}
/* 아래쪽을 살짝 눌러 둔다 — 검색바가 바탕에서 떠 보이게 */
.stage:after{content:'';position:absolute;left:0;right:0;bottom:0;height:32%;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(12,46,92,0) 0%,rgba(12,46,92,.05) 55%,rgba(12,46,92,.13) 100%)}
canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
canvas.drag{cursor:grabbing}
.axes{position:absolute;left:18px;top:16px;font:500 10px var(--mono);color:rgba(255,255,255,.72);line-height:1.7;letter-spacing:.02em;pointer-events:none}
.axes b{color:#fff;font-weight:600}
.axes div{opacity:0;transform:translateY(3px);transition:opacity .6s,transform .6s}
.axes div.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.axes div{opacity:1;transform:none;transition:none}}
.legend{position:absolute;right:18px;top:16px;display:grid;gap:4px;font:500 10px var(--mono);color:rgba(255,255,255,.8);pointer-events:none}
.legend span{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.legend i{width:6px;height:6px;border-radius:50%;box-shadow:0 0 0 1px rgba(255,255,255,.45)}
.legend .ln{width:18px;height:0;border-top:1px solid rgba(255,255,255,.85);border-radius:0;box-shadow:none}
.legend .ln.d{border-top-style:dashed;border-color:rgba(255,255,255,.6)}
/* 맵을 읽는 도구 — 축 투어 · 보기 전환. 설계 보기에 들어가지 않아도 맵만으로 이해되게 둔다 */
.axes{top:56px;left:16px;width:208px;padding:4px;border-radius:14px;pointer-events:auto;
  background:rgba(255,255,255,.44);backdrop-filter:blur(10px);color:#27456f}
.axes b{color:#12264a}
.axes button{display:block;width:100%;text-align:left;padding:4px 9px 5px;border-radius:10px;
  background:transparent;color:inherit;font:inherit;letter-spacing:inherit;cursor:pointer;transition:background .18s,color .18s}
.axes button:hover{background:rgba(255,255,255,.6)}
.axes button.on{background:#fff;color:#12264a}
.axes button small{display:block;margin-top:1px;font-size:9px;color:#50719f;letter-spacing:0}
.viewbar{position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:2;display:flex;gap:3px;padding:3px;border-radius:15px;
  background:rgba(255,255,255,.3);backdrop-filter:blur(8px);font:600 10px var(--mono)}
.viewbar button{height:24px;padding:0 11px;border-radius:12px;color:#2b4a7a;cursor:pointer;
  letter-spacing:-.01em;transition:background .18s,color .18s}
.viewbar button:hover{background:rgba(255,255,255,.55)}
.viewbar button.on{background:#fff;color:#12264a}
.tourcap{position:absolute;left:50%;top:60px;z-index:2;transform:translateX(-50%);padding:7px 15px;border-radius:16px;
  background:rgba(255,255,255,.36);backdrop-filter:blur(8px);color:#17305c;font:600 11px var(--mono);
  letter-spacing:-.01em;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none}
.tourcap.on{opacity:1}
.tourcap em{font-style:normal;opacity:.62;margin-left:9px;font-weight:500}
.scan{position:absolute;left:50%;bottom:78px;z-index:2;transform:translateX(-50%);display:none;align-items:center;gap:8px;
  padding:6px 14px;border-radius:15px;background:rgba(255,255,255,.36);backdrop-filter:blur(8px);
  color:#17305c;font:600 10.5px var(--mono);letter-spacing:-.01em;white-space:nowrap;pointer-events:none}
.scan.on{display:flex}
.scan i{width:6px;height:6px;border-radius:50%;background:#2f6bd8;animation:scanp 1s infinite}
@keyframes scanp{0%,100%{opacity:.25;transform:scale(.75)}50%{opacity:1;transform:scale(1.3)}}
.ask{position:absolute;left:50%;bottom:26px;z-index:2;transform:translateX(-50%);width:min(620px,calc(100% - 36px))}
/* 처음 온 사람이 무엇을 물으면 되는지 — 눌러서 바로 보내는 예시 */
.eg{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-bottom:10px}
.eg button{height:28px;padding:0 13px;border-radius:99px;background:rgba(255,255,255,.44);backdrop-filter:blur(8px);
  color:#27456f;font-size:12.5px;font-weight:500;letter-spacing:-.1px;transition:background .18s,color .18s}
.eg button:hover{background:#fff;color:#12264a}
/* 왼쪽 답변 패널 손잡이 — 닫혀 있을 때만 보인다 */
.ptab{position:absolute;left:0;top:50%;z-index:3;transform:translateY(-50%);display:flex;flex-direction:column;
  align-items:center;gap:6px;padding:14px 7px;border-radius:0 14px 14px 0;background:rgba(255,255,255,.44);
  backdrop-filter:blur(8px);color:#27456f;font-size:12px;font-weight:600;letter-spacing:-.1px;transition:background .18s}
.ptab:hover{background:#fff}
.ptab i{font-style:normal;font-size:9px;opacity:.7}
.ptab span{writing-mode:vertical-rl}
body:not(.bare) .ptab{display:none}
/* 전시 모드 자막 — 영화 자막처럼. 상자는 문장 길이만큼만.
   (.cap 은 설계 페이지의 그림 캡션이 이미 쓰고 있다 — 이름을 따로 둔다) */
.filmcap{position:absolute;left:50%;bottom:38px;z-index:4;transform:translateX(-50%);
  width:max-content;max-width:min(1040px,calc(100% - 72px));
  padding:13px 26px 15px;border-radius:8px;text-align:center;
  background:rgba(0,0,0,.36);backdrop-filter:blur(6px);transition:opacity .3s}
.filmcap.off{opacity:0}
.filmcap p{font-size:22px;line-height:1.45;font-weight:500;color:#fff;letter-spacing:-.3px;word-break:keep-all;
  text-shadow:0 1px 12px rgba(0,0,0,.28)}
/* 영상이 도는 동안에는 맵과 자막만 남긴다 — 조작용 UI 는 전부 비운다.
   들어갈 때는 빠르게, 끝나고 돌아올 때는 천천히 순서대로 올라온다 */
.ask,.eg,.ptab,.hint,.axes,.legend,.dsgn,.viewbar,.tourcap{transition:opacity .85s cubic-bezier(.3,0,.2,1)}
.axes,.dsgn{transition-delay:.18s}
.legend,.viewbar{transition-delay:.34s}
.ask,.eg,.hint{transition-delay:.5s}
body.demo .ask,body.demo .eg,body.demo .ptab,body.demo .hint,
body.demo .axes,body.demo .legend,body.demo .dsgn,body.demo .viewbar,body.demo .tourcap{
  opacity:0;pointer-events:none;transition-duration:.45s;transition-delay:0s}
@media (prefers-reduced-motion:reduce){.filmcap p{animation:none}}
.field{display:flex;align-items:center;gap:10px;height:46px;padding:0 8px 0 16px;border-radius:23px;
  background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.55);
  box-shadow:0 6px 24px rgba(30,70,150,.14);
  backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3)}
.field:focus-within{background:rgba(255,255,255,.58);border-color:rgba(255,255,255,.8)}
.field input{flex:1;color:#13315f;font-size:14px}
.field input::placeholder{color:rgba(19,49,95,.45)}
.field button{height:32px;padding:0 14px;border-radius:16px;background:rgba(255,255,255,.85);color:#13315f;font-size:12px;font-weight:750}
.field button:hover{background:#fff}
.hint{position:absolute;left:18px;bottom:22px;font:500 10px var(--mono);color:rgba(22,48,92,.52);pointer-events:none}

/* ── UI 숨기기 — 3D 와 질문창만 남긴다 (버튼 또는 H) ───────────────────── */
.bare-btn{position:absolute;right:16px;bottom:22px;display:flex;align-items:center;gap:7px;height:30px;padding:0 12px;
  border-radius:15px;background:rgba(255,255,255,.34);border:1px solid rgba(255,255,255,.5);
  backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);
  font:600 11px var(--mono);color:#13315f;opacity:.75;transition:opacity .2s,background .2s}
.bare-btn:hover{opacity:1;background:rgba(255,255,255,.6)}
.bare-btn i{font-style:normal;font-size:12px;line-height:1}
body.bare{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);overflow:hidden}
body.bare .side{display:none}
body.bare .stage{grid-column:1/-1}
body.bare .hint{opacity:0;pointer-events:none;transition:opacity .25s}
/* 설계 보기 — 상단 왼쪽 알약 */
.dsgn{position:absolute;left:18px;top:18px;z-index:2;height:28px;padding:0 14px;border-radius:14px;
  background:rgba(255,255,255,.92);box-shadow:0 1px 5px rgba(20,54,104,.14);
  font:600 11.5px SFKR,-apple-system,sans-serif;letter-spacing:-.02em;color:#13315F}
.dsgn:hover{background:#fff}
/* 세로 화면 — 검색바가 아래를 다 쓰므로 숨기기 버튼은 위로 올린다 */
@media (max-aspect-ratio:1/1){.ask{bottom:52px}}

/* ── 설계 들여다보기 ───────────────────── */
.dbtn{margin-top:10px;height:26px;padding:0 10px;border-radius:5px;border:1px solid var(--line);background:var(--card);
  font-size:11.5px;font-weight:650;color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.dbtn:hover{border-color:#c5cddb;color:var(--ink)}
.dbtn i{font:600 10px var(--mono);font-style:normal;color:var(--faint)}
.design{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding-inline:32px}
@media(max-width:860px){.design{padding-inline:18px}}
.dz{max-width:1040px;margin-inline:auto;padding-block:26px 72px}   /* 설계 글은 가운데로 — 넓은 화면에서 줄이 늘어지지 않게 */
.dh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding-block:14px;background:var(--bg);border-bottom:1px solid var(--line)}
.dh b{font-size:15px;font-weight:800;letter-spacing:.06em}
.dh span{font-size:12px;color:var(--dim);font-weight:600}
.dh button{margin-left:auto;height:28px;padding:0 12px;border-radius:6px;background:var(--ink);color:#fff;font-size:12px;font-weight:700}
.dsec{margin-top:28px}
.dsec>.lb{font:650 9.5px var(--mono);letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
.dsec>h2{margin-top:4px;font-size:17px;font-weight:780;letter-spacing:-.02em}
.dsec>p.sub{margin-top:6px;font-size:13px;color:var(--ink2);line-height:1.85;max-width:680px;word-break:keep-all}
.dgrid{margin-top:12px;display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.dc{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 13px}
.dc .k{font:650 9.5px var(--mono);letter-spacing:.06em;color:var(--dim);text-transform:uppercase}
.dc h4{margin-top:4px;font-size:13.5px;font-weight:740;line-height:1.4}
.dc p{margin-top:6px;font-size:12.5px;line-height:1.85;color:var(--ink2);word-break:keep-all}

<section class="design" id="design" hidden aria-label="온톨로지 설계"></section>

<aside class="side">
  <div class="top">
    <div class="brand"><b>IRIS</b><span>회의 온톨로지</span>
      <button type="button" id="pclose" title="답변 패널 닫기 (H)">◀</button></div>
    <div class="mt" id="mtitle"></div>
    <div class="mm" id="mmeta"></div>
    <button class="dbtn" id="dopen" type="button">이 맵은 뭔가요? <i>→</i></button>

  <div class="scroll">
    <div class="box" id="box" hidden></div>

      점을 누르면 그 점 하나만 밝아집니다 — 연결은 질문했을 때만 그려집니다.</p>
  </div>
</aside>

<main class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div class="axes">
    <div id="ax-x"><button type="button" data-tour="x"><b>X</b> 회의 시간 →<small>누르면 회의 순서대로 훑어요</small></button></div>
    <div id="ax-y"><button type="button" data-tour="y"><b>Y</b> 정보 역할 ↑<small>근거 · 쟁점 · 주장 · 결론 · 업무</small></button></div>
    <div id="ax-z"><button type="button" data-tour="z"><b>Z</b> 관계 밀도<small>많이 엮인 것일수록 앞으로</small></button></div>
  </div>
  <div class="tourcap" id="tourcap"></div>
  <div class="legend">
    <span>Evidence · Discussion <i style="background:#cfe4ff"></i></span>

  <button class="dsgn" id="dopen2" type="button">이 맵은 뭔가요?</button>
  <button class="ptab" id="popen" type="button" title="답변 패널 열기 (H)"><i>▶</i><span>답변</span></button>
  <div class="ask">
    <div class="eg" id="eg"></div>
    <form class="field" id="askf"><input id="askq" autocomplete="off" placeholder="이 회의에 대해 무엇이든 물어보세요"><button>탐색</button></form>
  </div>
  <div class="scan" id="scan"><i></i><span id="scantx"></span></div>
  <div class="filmcap" id="cap" hidden><p id="capt"></p></div>
  <div class="viewbar" id="viewbar">
    <button type="button" data-view="all" class="on">모두</button>
    <button type="button" data-view="nodes">요소</button>
    <button type="button" data-view="edges">관계</button>
  </div>
</main>

<script src="graph.js?v=20260927-provenance"></script>
<script>
"use strict";
/* 공개본은 graph.js 자체가 이미 가명으로 적혀 있다 — 대조표는 이 맥에만 둔다 */
const ALIAS = [];
const G = JSON.parse(ALIAS.reduce((t, [a, b]) => t.split(a).join(b), JSON.stringify(window.GRAPH)));
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const secs = s => s == null ? null : String(s).split(':').reverse().reduce((a, v, i) => a + (+v) * [1, 60, 3600][i], 0);

/* ================= 1. 그래프 ================= */
const NODES = G.nodes, EDGES = G.edges, BY = {};
NODES.forEach((n, i) => { BY[n.id] = n; n.out = []; n.in = []; n.sec = n.sec ?? secs(n.t); n.idx = i; });
EDGES.forEach(e => { e.s = BY[e.source]; e.d = BY[e.target]; e.s.out.push(e); e.d.in.push(e); });
const TOPIC = Object.fromEntries(G.topics.map(t => [t.id, t]));
const TEAM_OF = Object.fromEntries(G.participants.map(p => [p.name, p.team]));
const CTX = new Set(['Participant', 'Team', 'Meeting']);

const LEVEL = { Evidence: 0, Concern: 0, Question: 0, Issue: 1, Claim: 2, Proposal: 2, Condition: 2,
  Decision: 3, Conditional: 3, Open: 3, Action: 4, Participant: 5.35, Team: 5, Meeting: 3.4 };
/* 파란 바닥 위에 올리는 점이라 전부 밝은 색만 쓴다 — 어두운 색은 선과 글자 몫 */
const COLOR = { Evidence: '#cfe4ff', Question: '#c3d9ff', Issue: '#e4f0ff', Claim: '#d6e8ff', Proposal: '#cbe1ff',
  Concern: '#e0d8ff', Condition: '#d4c9ff', Conditional: '#eae4ff', Decision: '#ffffff', Open: '#dcd4f7',
  Action: '#000000', Participant: '#eaf2fd', Team: '#e0ecfb', Meeting: '#d2e4f9' };
/* 밝은 바탕에서 민트는 묻혀 보여서 업무만 검정으로 돌린다. 진하지 않게 20% 로만 찍는다 */
const NODE_A = { Action: .2 };
const SIZE = { Decision: 4.4, Conditional: 3.9, Issue: 3.3, Action: 3.4, Open: 3.3, Evidence: 2.5, Proposal: 2.6,
  Claim: 2.6, Concern: 2.4, Condition: 2.3, Question: 2.3, Participant: 3.2, Team: 3.6, Meeting: 3 };
const KO = { Evidence: '근거', Question: '질문', Issue: '쟁점', Claim: '주장', Proposal: '제안', Concern: '우려',
  Condition: '조건', Conditional: '조건부', Decision: '결정', Open: '미결', Action: '업무', Participant: '참여자', Team: '파트', Meeting: '회의' };
const VERB = { SUPPORTS: '뒷받침', CHALLENGES: '문제 제기', OPPOSES: '반박', REVISES: '수정', REPLACES: '대체',
  ADOPTED_AS: '채택', RESOLVES: '해결', QUESTIONS: '질문', RESPONDS_TO: '응답', DERIVED_FROM: '파생',
  LEADS_TO: '이어짐', CREATES: '업무 생성', ASSIGNED_TO: '담당', REQUIRES: '전제', REMAINS_UNRESOLVED: '미결 이월',
  CLARIFIES: '구체화', REFERENCES: '참조', CONVERGES_WITH: '수렴', AFFECTS: '영향', RESPONSIBLE_FOR: '책임', MEMBER_OF: '소속', SAID_BY: '발언자' };
const KEY = new Set(['ADOPTED_AS', 'RESOLVES', 'REVISES', 'REPLACES', 'CREATES']);
/* 관계는 세 갈래로 묶어 부른다 — 선 위에는 이 이름만 띄운다 */
const AXIS_EN = { discussion: 'Dynamics', outcome: 'Outcomes', participant: 'Actors' };
/* 책임자 표시 — 공개본에는 참가자 사진을 올리지 않는다 (글자 동그라미) */
const FACE_SRC = { 'Yebin': 'av1.svg', 'Lina': 'av2.svg', 'James': 'av3.svg', 'K': 'av4.svg' };
const FACE = {};
for (const k in FACE_SRC) { const im = new Image(); im.src = FACE_SRC[k]; FACE[k] = im; }

/* 위치 — 무작위 배치가 아니라 좌표마다 뜻이 있다 (가이드 12절)
   X 시간 · Y 위계 · Z 관계 밀도. 같은 칸에 겹치지 않게만 id 해시로 살짝 흩는다. */
const hash = s => { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return ((h >>> 0) % 10000) / 10000; };
const W = 2000, DUR = G.meeting.sec;
(() => {
  const body = NODES.filter(n => !CTX.has(n.type));
  body.forEach(n => {
    const nb = new Set(), parts = new Set(n.parts), who = new Set();
    [...n.out.map(e => e.d), ...n.in.map(e => e.s)].forEach(m => {
      if (m.type === 'Participant' || m.type === 'Team') { parts.add(m.type === 'Team' ? m.label : TEAM_OF[m.label]); return; }
      nb.add(m.id); (m.parts || []).forEach(p => parts.add(p)); if (m.speaker) who.add(m.speaker);
    });
    n.density = nb.size + 1.6 * (parts.size - 1) + 0.8 * who.size;
    n.degree = n.out.length + n.in.length;
  });
  const rank = body.slice().sort((a, b) => a.density - b.density);
  rank.forEach((n, i) => { n.zPct = i / (rank.length - 1); });
  body.forEach(n => {
    const j = hash(n.id), k = hash(n.id + '~');
    n.x = (n.sec / DUR - .5) * W + (j - .5) * 26;
    n.y = (LEVEL[n.type] - 2.2) * 175 + (k - .5) * 46;
    n.z = -(n.zPct - .5) * 1050 + (j - .5) * 70;          /* 관계가 촘촘할수록 앞으로(보는 사람 쪽) */
  });
  const people = NODES.filter(n => n.type === 'Participant'), teams = NODES.filter(n => n.type === 'Team');
  const meanX = xs => xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : 0;
  teams.forEach(t => { t.degree = t.in.length + t.out.length;
    t.x = meanX(t.in.filter(e => !CTX.has(e.s.type)).map(e => e.s.x)); t.y = (LEVEL.Team - 2.2) * 175; t.z = 380; });
  people.forEach((p, i) => { p.degree = p.in.length + p.out.length;
    const own = NODES.filter(n => n.speaker === p.label && !CTX.has(n.type));
    p.x = meanX(own.map(n => n.x)) + (i - 1.5) * 60; p.y = (LEVEL.Participant - 2.2) * 175; p.z = -260 + i * 60; });
  NODES.filter(n => n.type === 'Meeting').forEach((m, i) => { m.degree = m.in.length; m.x = W / 2 + 170 + i * 80;
    m.y = (LEVEL.Meeting - 2.2) * 175 + i * 40; m.z = (i - 1) * 180; });
  NODES.forEach(n => { n.r = SIZE[n.type] * (0.8 + 0.14 * Math.sqrt(n.degree || 1)); n.glow = 0; n.lit = 0; });
  EDGES.forEach(e => { e.lit = 0; });
})();

/* ================= 2. 렌더 ================= */
const cv = $('#cv'), ctx = cv.getContext('2d');
let DPR = 1, CW = 0, CH = 0, CY = 0;   /* CY — 점이 모이는 세로 가운데. 세로 화면에서는 검색바 몫만큼 위로 올린다 */
const MONO = 'ui-monospace,"SF Mono",Menlo,Consolas,monospace';   /* 번호·시각은 모노로 — 화면 위 수치처럼 */
const SANS = 'SFKR,-apple-system,"Apple SD Gothic Neo",sans-serif';   /* 한글은 SF Pro +KR Display */
const px = v => Math.round(v) + .5;                                /* 1px 선이 흐려지지 않게 반 칸 밀어 둔다 */
/* 광각 · 가까운 카메라 — 앞의 점은 크고 뒤의 점은 작고 흐리게. (예전 값: 초점 1.25 · 거리 2650) */
const FOCAL = .36, NEAR = 860;
const fog = p => Math.max(.18, Math.min(1, 1.55 - p.zc / (cam.dist * 1.25)));
const cam = { yaw: 0.52, pitch: -0.2, dist: NEAR, tx: 80, ty: 60, tz: 0 };   /* X 오른쪽 · Y 위 · Z 왼쪽 앞 으로 보이는 각도 */
const home = { ...cam };
let camTo = null, lastInput = 0;
function resize() {
  const r = cv.getBoundingClientRect(); DPR = Math.min(2, devicePixelRatio || 1);
  CW = r.width; CH = r.height; cv.width = CW * DPR; cv.height = CH * DPR;
  CY = CH > CW * 1.05 ? CH * .5 : CH * .46;   /* 세로 화면에서는 로고가 화면 정중앙에 오도록 */
}
addEventListener('resize', resize);

/* 표지 이미지의 입자감 — 타일 한 장을 미리 만들어 매 프레임 한 번만 깐다 */
const GRAIN = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 160;
  const g = c.getContext('2d'), d = g.createImageData(160, 160);
  for (let i = 0; i < d.data.length; i += 4) {
    d.data[i] = d.data[i + 1] = d.data[i + 2] = (Math.random() * 255) | 0;
    d.data[i + 3] = 15;
  }
  g.putImageData(d, 0, 0);
  return ctx.createPattern(c, 'repeat');
})();

/* 빛 점 스프라이트 — 색마다 한 번만 그려 둔다 */
const SPR = {};
function sprite(col) {
  if (SPR[col]) return SPR[col];
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, col); gr.addColorStop(.3, col + '88'); gr.addColorStop(.62, col + '1f'); gr.addColorStop(1, col + '00');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return (SPR[col] = c);
}

/* 공간 한가운데에 놓인 글자 로고 — 화면에 붙인 것이 아니라 3D 좌표에 있다 */
const LOGO_W = 170;                                  /* 공간 단위 폭. 가까울수록 커 보인다 */
const LOGO_IMG = new Image(); LOGO_IMG.src = 'Iris.svg';   /* 흰색 워드마크 — 글자를 그리지 않고 이 한 장을 쓴다 */
function drawLogo(p, a) {
  if (a <= .01) return;
  const w = LOGO_W * p.s;
  ctx.save();
  /* 글자 뒤에 옅은 빛 — 번진 도형을 깔아 둔 것처럼 */
  const gr = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, w * 1.5);
  gr.addColorStop(0, 'rgba(232,246,255,.62)'); gr.addColorStop(.42, 'rgba(226,243,255,.30)');
  gr.addColorStop(1, 'rgba(226,243,255,0)');
  ctx.globalAlpha = a; ctx.fillStyle = gr;
  ctx.fillRect(p.x - w * 1.5, p.y - w * 1.5, w * 3, w * 3);
  if (LOGO_IMG.naturalWidth) {
    const lw = w * 1.34, lh = lw * LOGO_IMG.naturalHeight / LOGO_IMG.naturalWidth;
    ctx.drawImage(LOGO_IMG, p.x - lw / 2, p.y - lh / 2, lw, lh);
  }
  ctx.restore();
}

/* 배경 먼지 — 구조와 무관한 아주 흐린 점 */
const DUST = Array.from({ length: 320 }, (_, i) => ({ x: (hash('dx' + i) - .5) * 3600, y: (hash('dy' + i) - .5) * 1800, z: (hash('dz' + i) - .5) * 2600, a: .05 + hash('da' + i) * .12 }));

/* 두 번 누르면 — 흩어진 점이 모두 화면에 들어오는 자리로 돌아온다 */
function fitAll() {

     점은 애초에 HC 를 비우고 바깥으로 밀어 둔 배치라 HC 가 이 구름의 진짜 중심이다 */
  const R = Math.max(...ns.map(n => Math.hypot(n.x - HC.x, n.y - HC.y, n.z - HC.z)));

cv.addEventListener('dblclick', () => { cancelQuery(); clearFocus(); home.yaw = 0.52; fitAll(); });
function pick(x, y) {

const LV = ['근거 · 우려 · 질문', '쟁점', '주장 · 제안 · 조건', '결론 (결정 · 조건부 · 미결)', '업무'];

const ext = k => { const v = BOX.body.map(n => n[k]); return [Math.min(...v), Math.max(...v)]; };

function tourStep(now, dt, kCam) {

  toks.forEach(([w, wt]) => { if (hay.includes(w)) s += wt * (w.length >= 3 ? 2 : 1.3) * (n.label.toLowerCase().includes(w) ? 1.6 : 1); });

/* 질문의 뼈대(누구 · 어느 파트 · 무엇을 묻나)는 먼저 떼어 낸다.

const RE = {

function interpret(q) {

const relTo = (n, types, tgt) => n.out.some(e => types.includes(e.type) && tgt(e.d));

  return relTo(n, ['ASSIGNED_TO', 'RESPONSIBLE_FOR', 'AFFECTS'], hit) || (who && n.speaker === who && n.type !== 'Action') || (team && !who && n.parts.includes(team));

function explore(q) {

    let acts = NODES.filter(n => n.type === 'Action' && (!tgt.length || n.out.some(e => e.type === 'ASSIGNED_TO' && tgt.includes(e.d.id))));
    const sc = acts.map(n => [n, score(n, I.toks)]), top = Math.max(0, ...sc.map(x => x[1]));
    if (top > 0 && I.toks.length) acts = sc.filter(x => x[1] > 0).map(x => x[0]);
    const mine = m => !I.who && !I.team ? true
      : m.id === 'p.' + I.who || m.id === 'team.' + (I.team || TEAM_OF[I.who]);
    acts.forEach(a => { final.add(a); add(a);
      a.in.filter(e => ['CREATES', 'LEADS_TO'].includes(e.type)).forEach(e => add(e.s));
      a.out.filter(e => e.type === 'ASSIGNED_TO' && mine(e.d)).forEach(e => add(e.d)); });
  } else if (I.intent === 'open') {
    let opens = NODES.filter(n => (n.type === 'Open' || (n.type === 'Conditional' && n.out.some(e => e.type === 'REQUIRES'))) && !resolved(n) && forWhom(n, I.who, I.team));
    const sc = opens.map(n => [n, score(n, I.toks)]), top = Math.max(0, ...sc.map(x => x[1]));
    if (top > 0) opens = sc.filter(x => x[1] > 0).map(x => x[0]);
    opens.forEach(o => { final.add(o); add(o);
      o.in.filter(e => ['CHALLENGES', 'SUPPORTS'].includes(e.type)).slice(0, 2).forEach(e => add(e.s));
      o.out.filter(e => ['DERIVED_FROM', 'REQUIRES', 'REMAINS_UNRESOLVED', 'RESPONSIBLE_FOR'].includes(e.type)).forEach(e => add(e.d)); });
  } else {
    const sc = NODES.map(n => [n, score(n, I.toks)]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]);
    if (!sc.length) return { I, fail: true };
    const seeds = sc.filter(x => x[1] >= sc[0][1] * .5).slice(0, 5).map(x => x[0]);

    const wts = seeds.map(n => score(n, I.toks) ** 2), W = wts.reduce((a, b) => a + b, 0);
    NODES.filter(n => n.type === 'Decision' || n.type === 'Conditional' || (n.type === 'Open' && !resolved(n))).forEach(d => {
      let sum = 0, cover = 0; maps.forEach((m, i) => { if (m.dist.has(d)) { sum += m.dist.get(d) * wts[i]; cover += wts[i]; } });
      if (!cover) return;
      const cost = sum / cover - 1.5 * cover / W - score(d, I.toks) * .6 + (d.type === 'Open' ? .4 : 0);

    final.add(target); add(target);
    maps.forEach((m, i) => { if (!m.dist.has(target) || m.dist.get(target) > 4) return;
      let cur = target; add(seeds[i]); while (m.prev.has(cur)) { const e = m.prev.get(cur); add(cur); cur = e.s === cur ? e.d : e.s; add(cur); } });
    // 그 결론으로 이어진 주장에 붙은 근거·반대·수정까지 한 걸음 더
    [...P].filter(n => ['Proposal', 'Claim', 'Decision', 'Conditional'].includes(n.type)).forEach(n =>
      n.in.filter(e => ['SUPPORTS', 'CHALLENGES', 'OPPOSES', 'REVISES', 'REPLACES', 'ADOPTED_AS'].includes(e.type))
        .slice(0, 3).forEach(e => add(e.s)));
    // 결정이 만든 업무 · 남긴 미결
    target.out.filter(e => e.type === 'CREATES').forEach(e => add(e.d));
    target.in.filter(e => e.type === 'DERIVED_FROM' && e.s.type === 'Open').forEach(e => add(e.s));

  if (!P.size) return { I, fail: true };
  const nodes = [...P].slice(0, 22);
  const inP = new Set(nodes);
  const edges = EDGES.filter(e => inP.has(e.s) && inP.has(e.d) && (e.axis !== 'participant' || ['ASSIGNED_TO', 'RESPONSIBLE_FOR', 'SAID_BY', 'MEMBER_OF'].includes(e.type)));
  const lv = n => LEVEL[n.type];
  edges.sort((a, b) => (Math.min(lv(a.s), lv(a.d)) - Math.min(lv(b.s), lv(b.d))) || ((a.s.sec ?? 1e6) - (b.s.sec ?? 1e6)));
  const seeds = nodes.filter(n => lv(n) <= 1 && !CTX.has(n.type)).sort((a, b) => a.sec - b.sec);
  return { I, nodes, edges, seeds: seeds.length ? seeds : nodes.slice(0, 3), final: [...final] };
}

/* 답의 문장 — 경로에 있는 노드·관계만으로 만든다. 지어낸 내용은 없다.
   노드 text 는 build.py 가 끝 형태를 검사해 둔다(결정·업무 '~ㄴ다', 근거 '~다', 미결 '~지/~못했다').
   그 덕에 여기서 '~하기로 했어요', '~다는 점' 으로 안전하게 바꿀 수 있다. */
const JONG = w => { const t = String(w).replace(/[\s”"’')\]]+$/, ''); const c = t.slice(-1).charCodeAt(0) - 0xAC00; return c >= 0 && c < 11172 ? c % 28 : -1; };
const josa = (w, a, b) => w + (JONG(w) > 0 && !(a === '으로' && JONG(w) === 8) ? a : b);   /* 받침 있으면 a · ㄹ받침은 '로' */
const stem = t => { t = t.trim(); if (t.endsWith('는다')) return t.slice(0, -2);
  const c = t.charCodeAt(t.length - 2) - 0xAC00; return t.slice(0, -2) + String.fromCharCode(0xAC00 + c - 4); };
const willDo = n => stem(n.text) + '기로 했어요';
const SRC_OF = { 인터뷰: ['인터뷰에서', '응답'], 실험: ['실험에서', '결과'], 조사: ['조사에서', '결과'], 책자: ['책자에서', '내용'],
  논문: ['논문에서', '내용'], 체험: ['체험에서', '감각'] };
function point(n) {                                    /* "~다" → "~다는 점" · "인터뷰: ~다" → "인터뷰에서 ~다는 응답" */
  let t = n.text.trim(), pre = '', noun = '점';
  const m = t.match(/^(인터뷰|실험|조사|책자|논문|체험):\s*/);
  if (m) { [pre, noun] = SRC_OF[m[1]]; pre += ' '; t = t.slice(m[0].length); }
  t = t.endsWith('이다') ? t.slice(0, -2) + '이라는' : t + '는';
  return `${pre}${t} ${noun}`;
}
function listOf(items, ja, jb) {                       /* "A, B와 C" + 마지막 조사 */
  if (!items.length) return '';
  const last = items[items.length - 1], head = items.slice(0, -1);
  const body = head.length ? `${head.slice(0, -1).map(x => x + ', ').join('')}${josa(head[head.length - 1], '과', '와')} ${last}` : last;
  return josa(body, ja, jb);
}
const resolved = n => n.in.some(e => e.type === 'RESOLVES');
const openSay = n => n.text.trim().endsWith('지') ? `${n.text.trim()}는 아직 정하지 못했어요` : n.text.trim().replace(/다$/, '어요');
const whoSay = m => m.type === 'Participant' ? `${m.label} 님` : `${m.label} 파트`;
function carry(n) {
  const nx = n.out.filter(e => e.type === 'REMAINS_UNRESOLVED').map(e => `“${e.d.label}”`);
  const own = n.out.filter(e => e.type === 'RESPONSIBLE_FOR').map(e => whoSay(e.d));
  const o = own.length ? `${listOf(own, '이', '가')} 맡아 보기로 했` : '', x = nx.length ? `${josa(nx[0], '으로', '로')} 넘어갔어요.` : '';
  return o && x ? ` ${o}고, ${x}` : o ? ` ${o}어요.` : x ? ` ${x}` : '';
}

function compose(R) {
  const lead = [], groups = [], inP = new Set(R.nodes);
  if (R.I.intent === 'todo') {
    const acts = R.final.slice().sort((a, b) => a.sec - b.sec);
    const subj = R.I.who ? `${R.I.who} 님이 맡은 일은` : R.I.team ? `${R.I.team} 파트가 맡은 일은` : '이번 회의에서 정해진 업무는';
    lead.push(acts.length ? `${subj} 모두 ${acts.length}가지예요.` : `${subj} 찾지 못했어요.`);
    const bucket = new Map();                           /* 사람 몫을 먼저, 파트 몫을 다음에 */
    acts.forEach(a => {
      const to = a.out.filter(e => e.type === 'ASSIGNED_TO' && inP.has(e.d)).map(e => e.d)
        .sort((x, y) => (x.type === 'Team') - (y.type === 'Team'))[0];
      const key = to ? whoSay(to) + (to.type === 'Team' ? ' 몫' : '') : '담당 미정';
      if (!bucket.has(key)) bucket.set(key, []);
      bucket.get(key).push(a);
    });
    [...bucket.entries()].sort((a, b) => a[0].includes('파트') - b[0].includes('파트'))
      .forEach(([k, as]) => as.forEach(a => groups.push([(R.I.team && !R.I.who ? '' : `${k} · `) + (TOPIC[a.topic]?.title || ''), `${willDo(a)}.`])));
    if (R.I.who && bucket.size > 1) lead.push(`직접 맡은 일과, ${TEAM_OF[R.I.who]} 파트 전체가 함께 맡은 일로 나눠 정리했어요.`);
  } else if (R.I.intent === 'open') {
    const os = R.final.slice().sort((a, b) => a.sec - b.sec);
    const scope = R.I.who ? `${R.I.who} 님과 관련해 ` : R.I.team ? `${R.I.team} 파트에서 ` : '';
    const opens = os.filter(n => n.type === 'Open'), conds = os.filter(n => n.type === 'Conditional');
    lead.push(`${scope}아직 매듭짓지 못한 건 ${opens.length}가지이고, 조건을 달고 넘어간 결정이 ${conds.length}가지 있어요.`);
    opens.forEach(n => groups.push([`미결 · ${TOPIC[n.topic]?.title || ''}`, `${openSay(n)}.${carry(n)}`.replace(/\.,/g, ',')]));
    conds.forEach(n => {
      const req = n.out.filter(e => e.type === 'REQUIRES').map(e => e.d)[0];
      const tail = !req ? '' : req.type === 'Open' ? ` 다만 ${openSay(req)}.`
        : ` 다만 ${josa(point(req), '이', '가')} ${req.type === 'Condition' ? '전제로 붙어 있어요' : '과제로 남아 있어요'}.`;
      groups.push([`조건부 · ${TOPIC[n.topic]?.title || ''}`, `${stem(n.text)}기로 했어요.${tail}`]);
    });
  } else {
    const d = R.final[0], used = new Set();
    if (d.type === 'Open') {
      used.add(d);
      lead.push(`아직 결론이 나지 않았어요. ${openSay(d)}.${carry(d)}`);
      const props = R.nodes.filter(n => n.type === 'Proposal').sort((a, b) => a.sec - b.sec);
      if (props.length) lead.push(`논의된 안으로는 ${listOf(props.map(n => `“${n.label}”`), '이', '가')} 나왔어요.`);
      R.nodes.filter(n => n.type === 'Concern').forEach(k => { used.add(k);
        const on = R.edges.find(e => e.s === k && ['CHALLENGES'].includes(e.type));
        lead.push(`${on ? `“${on.d.label}”에는 ` : ''}${josa(point(k), '이', '가')} 걸림돌로 꼽혔어요.`); });
      R.nodes.filter(n => n.type === 'Condition').forEach(c => { used.add(c); lead.push(`${josa(point(c), '도', '도')} 함께 이야기됐어요.`); });
    } else
    lead.push(`결론부터 말하면, ${willDo(d)}.`);
    d.out.filter(e => e.type === 'REQUIRES').forEach(e => { used.add(e.d);
      lead.push(e.d.type === 'Open' ? `다만 ${openSay(e.d)}.` : `다만 ${josa(point(e.d), '이', '가')} ${e.d.type === 'Condition' ? '전제로 붙어 있어요' : '과제로 남아 있어요'}.`); });
    // 무엇이 무엇을 바꿨나
    R.edges.filter(e => e.type === 'REVISES' || e.type === 'REPLACES').sort((a, b) => (a.sec ?? 0) - (b.sec ?? 0)).slice(0, 2).forEach(e => {
      const old = e.d, nu = e.s;
      const ch = R.edges.filter(x => ['CHALLENGES', 'OPPOSES'].includes(x.type) && x.d === old).map(x => x.s);
      ch.forEach(c => used.add(c));
      const why = ch.length ? `${listOf(ch.slice(0, 2).map(point), '이', '가')} 지적되면서 ` : '';
      lead.push(`처음에는 “${old.label}” 쪽으로 이야기가 나왔는데, ${why}“${nu.label}” 쪽으로 바뀌었어요.`);
      used.add(old); used.add(nu);
    });
    // 반론이 있었지만 다른 근거로 정리된 것
    R.nodes.filter(n => n.type === 'Concern' && !used.has(n)).forEach(k => {
      const by = R.edges.filter(x => x.type === 'OPPOSES' && x.d === k).map(x => x.s);
      if (!by.length) return;
      by.forEach(b => used.add(b)); used.add(k);
      lead.push(`${josa(point(k), '이', '가')} 반론으로 나왔지만, ${josa(listOf(by.slice(0, 2).map(point), '', ''), '으로', '로')} 정리됐어요.`);
    });
    // 뒷받침한 근거 — 명시된 관계 · 확신도 높은 순으로 셋까지
    const sup = R.nodes.filter(n => (n.type === 'Evidence' || n.type === 'Claim') && !used.has(n))
      .map(n => [n, Math.max(0, ...n.out.filter(e => inP.has(e.d)).map(e => (e.explicitness === 'explicit' ? 1 : .6) * e.confidence))])
      .sort((a, b) => b[1] - a[1]).slice(0, 3).map(x => x[0]).sort((a, b) => a.sec - b.sec);
    if (sup.length) lead.push(d.type === 'Open' ? `함께 나온 이야기로는 ${listOf(sup.map(point), '이', '가')} 있어요.`
      : `이렇게 정한 근거로는 ${listOf(sup.map(point), '이', '가')} 꼽혔어요.`);
    // 그래서 생긴 일 · 남은 일
    R.nodes.filter(n => n.type === 'Action').forEach(a => {
      const to = a.out.filter(e => e.type === 'ASSIGNED_TO').map(e => e.d).sort((x, y) => (x.type === 'Team') - (y.type === 'Team'))[0];
      lead.push(`${d.type === 'Open' ? '관련 업무로는' : '이 결정에 따라'} ${to ? (to.type === 'Team' ? `${to.label} 파트에서` : `${to.label} 님이`) + ' ' : ''}${willDo(a)}.`);
    });
    R.nodes.filter(n => n.type === 'Open' && !used.has(n) && !resolved(n) && n !== d).forEach(o => lead.push(`다만 ${openSay(o)}.`));
  }
  return { lead, groups };
}

const STEP_NAMES = ['질문을 읽는 중', '맵에서 관계를 따라가는 중', '답을 정리하는 중'];
/* 탐색 순서는 타이머로 돈다. 그리기(rAF)와 떼어 두어야 탭이 가려져 있어도 답이 끝까지 나온다. */
const Q = { active: false, timers: [] };
function cancelQuery() { Q.active = false; Q.timers.forEach(clearTimeout); Q.timers = []; orbitOff(); stopScan(); }

/* 답을 기다리는 동안 맵이 가만히 있지 않게 — 질문에 걸리는 점을 하나씩 빠르게 짚어 본다.
   고르는 기준은 규칙 기반 탐색이 실제로 쓰는 score() 다. 아무 점이나 깜빡이는 것이 아니다. */
const SCAN = { timer: 0, i: 0, list: [] };
function startScan(q) {
  const toks = tokens(q);
  const ranked = NODES.filter(n => !CTX.has(n.type) && n.x != null)
    .map(n => [n, score(n, toks)]).sort((a, b) => b[1] - a[1]);
  const hit = ranked.filter(r => r[1] > 0).map(r => r[0]);
  SCAN.list = (hit.length >= 5 ? hit : ranked.map(r => r[0])).slice(0, 40);
  SCAN.i = 0;
  if (hit.length >= 5) lookAt(hit.slice(0, 12));      /* 걸리는 데가 있으면 그 언저리로 먼저 간다 */
  $('#scan').classList.add('on');
  /* 점 하나를 켜면서 그 점에 걸린 논의 관계선 하나도 같이 흘린다 — 관계를 따라가는 중인 것이 보이게 */
  SCAN.timer = setInterval(() => {
    const n = SCAN.list[SCAN.i++ % SCAN.list.length];
    if (!n) return;
    n.glowTo = .88;                                  /* .95 를 넘기면 이름표까지 깜빡여 어지럽다 */
    const e = [...n.out, ...n.in].find(x => DISC.has(x.axis));
    if (e) { e.litTo = .8; particles.push({ e, t0: performance.now(), dur: 430 }); }
    setTimeout(() => { if (SCAN.timer) { n.glowTo = 0; if (e) e.litTo = 0; } }, 430);
  }, 60);
}
function stopScan() {
  if (!SCAN.timer) return;
  clearInterval(SCAN.timer); SCAN.timer = 0;
  SCAN.list.forEach(n => { n.glowTo = 0; [...n.out, ...n.in].forEach(e => { e.litTo = 0; }); });
  $('#scan').classList.remove('on');
}
function setStep(i) {
  const l = $('#box').querySelector('.stepl');
  if (l) l.textContent = STEP_NAMES[Math.min(STEP_NAMES.length - 1, i)];
}
function stepDone() {                                  /* 답이 나오면 진행 표시는 치운다 */

    .sort((a, b) => Math.min(rank.get(a.s), rank.get(a.d)) - Math.min(rank.get(b.s), rank.get(b.d)));
  /* 선이 닿은 점만 밝힌다 — 간선 없이 혼자 밝아지면 '왜 밝지?'가 된다.

  R.seeds.forEach(n => at(170, () => { n.glowTo = .7; }));

  const seen = new Set(R.seeds);

        ['Z · 연결 범위','이웃 노드 수와 연결된 파트·발언자 범위를 합산해 배치','연결 범위가 큰 논의 → Z 방향으로 구분','사람·파트는 별도 맥락 영역 / 일정은 후속 영역']
      ],'시간 · 역할 · 연결 범위를 가진 맵','속성에서 좌표 계산'],
      ['질문으로 경로 탐색',[
        ['질문을 탐색 기준으로 해석','대상·의도·참여자 범위에 따라 필요한 노드와 관계 선택','“UX의 할 일?” → 업무 → 담당 → UX','“누가 이 안을 말했나?” → 제안 → 발언자 → 사람'],
        ['관계를 따라 이유와 책임 조회','같은 주제의 항목 나열보다 관계가 이어지는 과정을 확인','“왜 바뀌었나?” → 우려·근거 → 수정 → 채택','“다음에 누가 하나?” → 결정 → 업무 → 담당자'],

      ],'무엇 · 왜 · 누구까지 연결된 답변','그래프 조회 · 근거 확인']
    ].map(([title,cards,result,method],i)=>`<li><div class="step-head"><span class="step-number" aria-label="${i+1}단계">${i+1}</span><h3>${title}</h3></div>${cards.map(([heading,desc,ex1,ex2])=>`<div class="logic-card"><h4>${heading}</h4><p>${desc}</p><div class="logic-example">${ex1}</div><div class="logic-example">${ex2}</div></div>`).join('')}<div class="output-arrow" aria-hidden="true">↓</div><div class="logic-result">${result}</div><div class="step-engine">${method}</div></li>`).join('')}</ol>
    <details class="implementation-note"><summary>설계 원칙과 현재 구현의 범위</summary><p>현재 노드와 의미 관계는 원문을 검토해 사전 정의하며 빌드 시 출처를 대조합니다. 질문 시 AI가 이 그래프를 읽습니다. 분류 기준은 자동 분류기가 이미 구현되었다는 의미가 아닙니다. 참여자의 소속은 기존 데이터의 추론 상태를 유지하고, 직책·회의 역할은 확인되지 않아 채우지 않았습니다. 현재 저장 방식은 graph.js이며 별도의 그래프 DB 엔진은 사용하지 않습니다. 노드·방향 있는 관계·속성을 갖춘 그래프 데이터 모델을 시각화한 프로토타입입니다.</p></details>
  </section>

  <section class="dsec"><div class="lb">AS IS · TO BE · 무엇이 달라지나</div>
    <h2>요약은 결론을 남기고, 그래프는 과정을 남깁니다</h2>
    <p class="sub">기존 AI 회의록 서비스도 ‘무엇을 정했는가’는 잘 뽑습니다. 다만 요약은 한 번 접고 나면 펼 수 없는 압축이라,
      가장 먼저 잘리는 것이 반대 의견 · 달아 둔 조건 · 아직 닫히지 않은 쟁점입니다. 이 맵은 접지 않고 세워 둡니다.</p>
    <div class="ab">
      <div class="hd"><span></span><u>AS IS · 요약문으로 남길 때</u><u class="t">TO BE · 관계 그래프로 세울 때</u></div>
      <div><span>남는 것</span>
        <p>결론 몇 줄. 왜 그렇게 됐는지는 압축 과정에서 사라집니다. 반대했던 사람, 달아 둔 조건, 바뀐 안은 보통 한 줄로 뭉개지거나 빠집니다.</p>
        <p class="t">근거 · 쟁점 · 주장 · 조건 · 결론 · 업무가 <b>각각 하나의 점</b>이고, 무엇이 무엇을 바꿨는지가 선으로 남습니다. 이 회의에서 점 ${NODES.length}개, 관계 ${EDGES.length}개입니다.</p></div>
      <div><span>물을 수 있는 것</span>
        <p>“무엇을 정했어?”까지. 단어가 겹치는 문단을 찾아 줄 뿐이라 <b>“왜 그렇게 정했어?”</b>처럼 관계를 묻는 질문에는 본문을 다시 읽어야 답이 나옵니다.</p>
        <p class="t">“왜 · 누가 맡나 · 무엇이 막혔나”가 모두 <b>같은 그래프 위의 경로 조회</b>입니다. 질문이 바뀌어도 요약을 다시 만들지 않고 지나가는 길만 달라집니다.</p></div>
      <div><span>출처</span>
        <p>요약 문장이 어느 발언에서 나왔는지 되짚기 어렵습니다. 맞는지 아닌지는 결국 읽는 사람이 녹취를 다시 듣고 판단하게 됩니다.</p>
        <p class="t">점마다 <b>말한 사람 · 시각 · 원 발화</b>가 달려 있습니다. 답을 의심하면 그 자리를 눌러 바로 그 문장으로 갑니다. 원 발화가 붙은 점이 ${NODES.filter(n=>n.quote).length}개입니다.</p></div>
      <div><span>지어낸 것의 표시</span>
        <p>요약문은 모델이 메운 부분과 실제로 나온 말이 같은 문체로 섞여 나옵니다. 어디까지가 회의였는지 구분할 방법이 없습니다.</p>
        <p class="t">관계마다 <code>explicit</code> · <code>inferred</code> 와 신뢰도를 답니다. 추론으로 이은 선은 점선으로 그리고, 답변에서도 “~로 보여요”로 낮춰 말합니다. 지금 ${EDGES.filter(e=>e.explicitness==='explicit').length} / ${EDGES.length}이 명시입니다.</p></div>
      <div><span>보는 각도</span>
        <p>“할 일만”, “UX 파트만”처럼 보는 각도가 달라질 때마다 <b>새 요약</b>이 필요합니다. 각도마다 문장이 달라져 서로 어긋나기도 합니다.</p>
        <p class="t">한 벌의 그래프에서 담당별 · 파트별 · 상태별 보기가 모두 나옵니다. 각도를 바꿔도 <b>근거는 같은 자리</b>를 가리킵니다.</p></div>
      <div><span>회의가 쌓이면</span>
        <p>회의록이 한 건씩 따로 쌓입니다. 지난번 미결이 이번에 어떻게 됐는지는 사람이 기억해서 이어 줘야 합니다.</p>
        <p class="t">미결은 <code>REMAINS_UNRESOLVED</code> 로 다음 회의에 물리고, 같은 사람 · 파트 · 주제가 회의를 가로질러 이어집니다. 회의가 쌓일수록 그래프가 두꺼워집니다.</p></div>
      <div><span>읽는 방식</span>
        <p>위에서 아래로 읽는 글입니다. 어디가 중요한지는 요약을 쓴 쪽이 정합니다.</p>
        <p class="t">좌표에 뜻이 있습니다 — X 는 회의 시간, Y 는 정보의 역할, Z 는 관계 밀도. 축을 눌러 훑어보면 <b>어디에 무엇이 몰려 있는지</b>가 먼저 보입니다.</p></div>
    </div>
    <p class="sub" style="margin-top:12px">요약을 대신하려는 것이 아닙니다. 요약은 그래프에서 언제든 다시 뽑을 수 있지만,
      <b>요약에서 그래프를 되살릴 수는 없습니다.</b> 그래서 접기 전 단계를 남겨 두는 쪽을 택했습니다.</p>
  </section>

  <section class="dsec" aria-labelledby="ibis-title"><div class="lb">RELATION MAP · 관계 맵</div>
    <h2 id="ibis-title">회의 한 시간이 보드 한 장이 되기까지</h2>
    <p class="sub">관계 맵은 같은 회의를 <b>쟁점 하나 = 보드 하나</b>로 좁혀 보여 주는 화면입니다. 이 온톨로지가 회의 전체를 하나의 그래프로 펼친다면, 관계 맵은 “무엇을 두고 갈렸고 어디로 닫혔는지”만 남깁니다. 아래 다섯 걸음을 거칩니다.</p>

          <text x="111" y="30" font-size="7.5" fill="#4a5a7a">메인은 안전한 학습으로</text>
          <text x="95" y="60" text-anchor="middle" font-size="8.5" fill="#6e7a8d">카드 시각 = 그 발언이 나온 시각</text>

            <rect x="12" y="76" width="56" height="22" rx="5" fill="#3a3f52"/><text x="40" y="91" fill="#fff">규칙 검사</text>
            <rect x="122" y="76" width="56" height="22" rx="5" fill="#e7e9f0" stroke="#d8dce6"/><text x="150" y="91" fill="#6e7a8d">어긴 곳만 수정</text>

        </svg></div>
      </div>
    </div>

    <div class="grid2" style="margin-top:20px">
      <div class="dc"><div class="k">01 — 무엇을 쟁점으로 보나</div><h4>그 자리에서 답을 내야 했던 물음 하나</h4>
        <p>논의를 끊는 기준은 ‘말이 길어졌는가’가 아니라 <b>답이 필요했는가</b>입니다. 묻고 답한 자리, 서로 다른 안이 나온 자리, 한 사람이 정리해 와서 팀이 확인한 자리 — 이 셋은 모두 답이 필요했던 자리입니다. 그 안에서 <b>답해야 했던 것 하나</b>를 골라 쟁점으로 세웁니다.</p>
        <p>반대로 잡담·안부·일정 확인만 오간 대목, 전사가 뭉개져 무슨 말인지 알 수 없는 대목은 논의로 만들지 않습니다. 결론이 안 난 자리도 그대로 남깁니다 — 흐지부지된 것도 기록이기 때문입니다.</p></div>
      <div class="dc"><div class="k">01 — 어떤 단서로 추리나</div><h4>끊는 자리와 합치는 자리</h4>
        <p><b>끊는다</b> · 다루는 대상이 바뀌고, 앞 이야기를 더 받지 않을 때.<br>
        <b>합친다</b> · 뒤에서 같은 주제로 돌아왔으면 한 논의로 묶고 구간을 그 범위로 넓힙니다.<br>
        <b>넣지 않는다</b> · 한 주제 안의 세부 항목은 따로 끊지 않고 그 논의의 카드로 넣습니다.<br>
        <b>버린다</b> · 논의를 움직이지 않은 말, 근거 구절을 못 찾는 말.</p>
        <p>이 규칙을 지켰는지는 사람이 아니라 코드가 셉니다. 논의가 6개보다 적거나 16개보다 많으면, 또는 평균 5분을 밑돌면 되돌려 다시 묶습니다.</p></div>
    </div>

    <div class="dc" style="margin-top:8px"><div class="k">01 — 쟁점 제목 쓰는 법</div><h4>그 자리가 어떤 자리였는지에 따라 달라집니다</h4>
      <div class="cases">
        <div><span>두 갈래에서 고른 자리</span><b>물음으로</b><em>부스트를 쓰는 단체 장면을 남길 것인가</em></div>
        <div><span>값·대상·범위를 좁혀 정한 자리</span><b>안건 이름으로</b><em>프로젝터 장착 위치와 사출 범위</em></div>
        <div><span>해 온 것을 공유·점검한 자리</span><b>안건 이름으로</b><em>인터뷰로 다시 잡은 제품의 중심 가치</em></div>
      </div>
      <p style="margin-top:10px">고른 자리가 아니었는데 물음으로 적으면, 읽는 사람이 없던 대립을 찾게 됩니다. 한 사람이 정리해 와서 공유한 자리를 “A냐 B냐”로 쓰지 않는 이유입니다.</p></div>

    <p class="sub" style="margin-top:16px">다섯 걸음 가운데 품을 가장 많이 들인 곳은 마지막입니다. “더 잘 써 달라”고 다시 부탁하는 대신, <b>지켜야 할 것을 숫자와 형태로 적어 두고 어긴 카드만 이름을 불러 되돌립니다.</b> 섹션은 6~16개, 보드마다 쟁점은 하나, 카드는 4~9장, 주장은 제안형으로, 설명은 25~70자, 근거 구절은 말한 사람의 발언 안에 실제로 있을 것 — 이런 것들입니다. 그래서 같은 회의를 다시 돌려도 문장은 조금씩 달라져도 <b>구조는 흔들리지 않습니다.</b></p>
  </section>

  <section class="dsec"><div class="lb">ANATOMY · 카드 한 장</div>
    <h2>카드에는 네 가지가 들어갑니다</h2>
    <p class="sub">보드에 놓이는 카드는 세 종류입니다. 아래는 실제 화면에 그려지는 카드 그대로이고, 오른쪽은 각 자리에 무엇이 들어가는지입니다.</p>

    <div class="anat">
      <div class="an">
        <div class="fig"><div class="cap">쟁점 · 보드마다 한 장</div>
          <div class="mn issue"><div class="lab">쟁점</div><h5>인터뷰로 다시 잡은 제품의 중심 가치</h5></div></div>
        <ol>
          <li><i>1</i><div><b>라벨</b> — 이 보드가 무엇을 다루는지 알리는 한 단어. 쟁점 카드는 보드마다 딱 한 장이라 번호나 설명을 붙이지 않습니다.</div></li>
          <li><i>2</i><div><b>제목</b> — 의견이 실제로 갈렸으면 <b>물음</b>으로, 한 사람이 정리해 와서 공유한 자리면 <b>명사 한 덩어리</b>로 적습니다. 공유한 자리를 물음으로 쓰면 없던 논쟁이 있었던 것처럼 읽히기 때문입니다.<em>중심 가치를 어디에 둘 것인가 / 제품 기능과 강도 단계 구성</em></div></li>
          <li><i>3</i><div><b>프로필 없음</b> — 쟁점은 누구 한 사람의 말이 아니라 그 자리에서 다뤄진 물음이라, 얼굴을 붙이지 않습니다.</div></li>
          <li><i>4</i><div><b>검은 카드</b> — 보드에서 가장 먼저 눈에 들어오도록 유일하게 어두운 색을 씁니다.</div></li>
        </ol>
      </div>

      <div class="an">
        <div class="fig"><div class="cap">주장 · 보드의 본문</div>
          <div class="mn"><div class="who"></div>
            <h5>안전하게 전문가의 움직임을 익히는 경험을 메인에 두자</h5>
            <p>몸을 프로 수준까지 끌어올리는 쪽은 강조하지 않기로 했다 · 조건 · 강화 요소는 서브로 남긴다</p>
            <div class="more">눌러서 전부 보기</div></div></div>
        <ol>
          <li><i>1</i><div><b>프로필 = 주요 발언자</b> — 이 주장을 <b>민 사람</b> 한 명입니다. 거들어 준 사람이 여럿이어도 가장 먼저, 가장 세게 민 사람 하나만 붙입니다. 말한 사람과 담당자는 다른 정보라, 책임은 할 일 쪽에서 따로 봅니다.</div></li>
          <li><i>2</i><div><b>제목은 제안형</b> — “~한다”가 아니라 <b>“~하자 · ~해야 한다 · ~기로 한다”</b>로 끝맺습니다. 읽는 사람이 이게 결론인지 누군가의 의견인지 헷갈리지 않게 하려는 규칙입니다. 12~60자.<em>메인은 안전한 학습으로 가자</em></div></li>
          <li><i>3</i><div><b>캡션(설명)</b> — 왜 그렇게 말했는지 한 문장. 여기에 <b>딸린 말이 함께 들어옵니다.</b> 근거는 그대로, 조건은 <code>조건 ·</code>, 우려는 <code>우려 ·</code> 를 앞에 달고 가운뎃점으로 이어 붙습니다. 25~70자.<em>근거 그대로 · 조건 · … · 우려 · …</em></div></li>
          <li><i>4</i><div><b>잘렸을 때</b> — 세 줄이 넘으면 아래에 <b>눌러서 전부 보기</b>가 뜹니다. 카드를 누르면 그 자리에서 펼쳐지고, 왼쪽 원문에서 그 발언이 함께 밝아집니다.</div></li>
        </ol>
      </div>

      <div class="an">
        <div class="fig"><div class="cap">결론 · 보드가 닿은 자리</div>
          <div class="mn res"><div class="lab">결론</div><h5>메인은 안전한 학습으로 가고 강화·재미는 서브로 남긴다</h5></div></div>
        <ol>
          <li><i>1</i><div><b>라벨</b> — 결론은 세 가지 상태로 나뉩니다. <b>확정</b>(합의하고 넘어감), <b>조건부</b>(전제를 달고 받음), <b>미결</b>(정하지 못하고 남김).</div></li>
          <li><i>2</i><div><b>제목은 단정형</b> — 무엇을 하기로 했는지 끝맺는 문장으로 씁니다. 미결이면 길게 쓰지 않고 남은 안건 이름만 짧게 적습니다.<em>신발과 어떻게 결착할지 (미결)</em></div></li>
          <li><i>3</i><div><b>프로필 없음</b> — 한 사람의 말이 아니라 보드 전체가 닿은 자리이기 때문입니다.</div></li>
          <li><i>4</i><div><b>비워 두지 않습니다</b> — 아무도 닫지 않은 채 넘어갔으면 빈칸으로 두지 않고 <b>‘미결’로 남깁니다.</b> 흐지부지된 것도 기록이기 때문입니다. 반대로 확정이 전체의 3분의 2를 넘으면 대개 잘못 읽은 것으로 보고 다시 확인합니다.</div></li>
        </ol>
      </div>
    </div>
  </section>

  <section class="dsec"><div class="lb">LINES · 선 읽는 법</div>
    <h2>선은 세 가지만 말합니다</h2>
    <p class="sub">선이 많아지면 보드는 금세 거미줄이 됩니다. 그래서 이을 수 있는데도 일부러 긋지 않는 선이 있습니다.</p>
    <div class="lines">
      <div class="dc"><div class="k">01 흐름</div><h4>실선 · 한쪽 화살표</h4>
        <p>쟁점에서 주장으로, 주장에서 결론으로 <b>이야기가 흘러간 방향</b>입니다. 화살표는 늘 먼저 나온 말에서 나중에 나온 말 쪽으로 향합니다. 결론으로 들어가는 선만 금색이라, 어디로 닫혔는지 멀리서도 보입니다.</p>
        <div class="fg"><svg viewBox="0 0 190 106" aria-hidden="true">
          <rect x="8" y="6" width="56" height="24" rx="5" fill="#161919"/><text x="36" y="22" text-anchor="middle" font-size="9.5" fill="#fff">쟁점</text>
          <path d="M36 34v10" stroke="#c3cede" stroke-width="2" fill="none"/><path d="M36 50l-4.5-8h9z" fill="#c3cede"/>
          <rect x="8" y="52" width="56" height="24" rx="5" fill="#e5ebf7" stroke="#d2dcf0"/><text x="36" y="68" text-anchor="middle" font-size="9.5" fill="#365493">주장</text>
          <path d="M68 64h44v12" stroke="#d99a2b" stroke-width="2" fill="none"/><path d="M112 82l-4.5-8h9z" fill="#d99a2b"/>
          <rect x="84" y="84" width="58" height="22" rx="5" fill="#cfe8fb" stroke="#b7dbf6" opacity=".001"/>
          <rect x="84" y="82" width="58" height="22" rx="5" fill="#cfe8fb" stroke="#b7dbf6"/><text x="113" y="97" text-anchor="middle" font-size="9.5" fill="#1e6a98">결론</text>
          <text x="150" y="60" font-size="8" fill="#b8862a">결론으로</text><text x="150" y="70" font-size="8" fill="#b8862a">가는 선만</text><text x="150" y="80" font-size="8" fill="#b8862a">금색</text>
        </svg></div></div>

      <div class="dc"><div class="k">02 맞섬</div><h4>빨간 선 · 양쪽 화살표</h4>
        <p>두 주장이 <b>서로를 겨누고 있을 때</b>만 씁니다. 양쪽에 화살표가 달려 있으면 어느 쪽도 이기지 않았다는 뜻입니다. 같은 사람이 한 말끼리는 맞섬으로 잇지 않습니다 — 그건 생각이 바뀐 것이지 대립이 아니기 때문입니다.</p>
        <div class="fg"><svg viewBox="0 0 190 92" aria-hidden="true">
          <rect x="4" y="22" width="72" height="26" rx="5" fill="#e5ebf7" stroke="#d2dcf0"/><text x="40" y="39" text-anchor="middle" font-size="9.5" fill="#365493">주장 · 예나</text>
          <rect x="114" y="22" width="72" height="26" rx="5" fill="#f7e3e1" stroke="#eecfcb"/><text x="150" y="39" text-anchor="middle" font-size="9.5" fill="#b3493c">반론 · 하린</text>
          <path d="M88 35h14" stroke="#e0443e" stroke-width="2.4" fill="none"/>
          <path d="M78 35l9-5v10z" fill="#e0443e"/><path d="M112 35l-9-5v10z" fill="#e0443e"/>
          <text x="95" y="72" text-anchor="middle" font-size="8.5" fill="#6e7a8d">어느 쪽도 이기지 않은 채 남았다</text>
        </svg></div></div>

      <div class="dc"><div class="k">03 선 없음</div><h4>선 대신 자리로</h4>
        <p>한 주장에 딸린 근거·조건·우려는 <b>선을 긋지 않습니다.</b> 카드 안의 설명으로 들어가고, 그래도 따로 보여야 할 말은 바로 아래 칸에 놓아 한 덩어리로 읽히게 합니다. 선 하나를 아끼면 맞선 지점이 그만큼 또렷해집니다.</p>
        <div class="fg"><svg viewBox="0 0 190 106" aria-hidden="true">
          <rect x="48" y="12" width="94" height="30" rx="7" fill="#e5ebf7" stroke="#d2dcf0"/><text x="95" y="31" text-anchor="middle" font-size="9.5" fill="#365493">주장</text>
          <rect x="48" y="46" width="94" height="14" rx="4" fill="#eef1f8"/><text x="95" y="56" text-anchor="middle" font-size="8" fill="#7b8699">근거 · 조건 · 우려</text>
          <rect x="40" y="5" width="110" height="62" rx="13" fill="none" stroke="#9fc0f2" stroke-width="1.6"/>
          <text x="95" y="88" text-anchor="middle" font-size="8.5" fill="#6e7a8d">한 덩어리로 묶어</text>
          <text x="95" y="100" text-anchor="middle" font-size="8.5" fill="#6e7a8d">테두리만 보여 줍니다</text>
        </svg></div></div>
    </div>
    <div class="dc" style="margin-top:8px"><div class="k">경계</div><h4>다른 쟁점끼리는 잇지 않습니다</h4>
      <p>선은 <b>같은 보드 안에서만</b> 그립니다. 다른 쟁점의 카드를 이으면 없던 인과가 있는 것처럼 읽히기 때문입니다. 회의 전체를 가로지르는 연결은 이 온톨로지 맵이 맡습니다 — 두 화면의 역할을 그렇게 나눠 두었습니다.</p></div>
  </section>

  <section class="dsec"><div class="lb">BRIDGE · 두 맵의 사이</div>
    <h2>관계 맵의 카드는 여기서 어떤 점이 되나</h2>
    <p class="sub">같은 회의에서 나온 두 구조라 종류끼리 그대로 맞물립니다. 다른 점은 하나입니다 — <b>관계 맵은 한 화면에 담으려고 합치고, 온톨로지는 어디서든 묻게 하려고 낱낱이 세웁니다.</b></p>
    <div class="tbl cardmap">
      <div><b>쟁점</b><em>issue</em><span>→ <code>Issue</code> · 그 논의에서 답해야 했던 물음</span></div>
      <div><b>주장</b><em>position</em><span>→ <code>Proposal</code> / <code>Claim</code> · 이렇게 하자는 안, 근거를 가진 판단</span></div>
      <div><b>근거</b><em>pro</em><span>→ <code>Evidence</code> + <code>SUPPORTS</code> · 카드 안 설명이던 것이 여기선 독립된 점이 됩니다</span></div>
      <div><b>반론</b><em>con</em><span>→ <code>OPPOSES</code> / <code>CHALLENGES</code> · 카드이던 것이 여기선 선의 종류가 됩니다</span></div>
      <div><b>우려</b><em>concern</em><span>→ <code>Concern</code></span></div>
      <div><b>조건</b><em>condition</em><span>→ <code>Condition</code> + <code>REQUIRES</code></span></div>
      <div><b>결론</b><em>resolution</em><span>→ <code>Decision</code> / <code>Conditional</code> / <code>Open</code> + <code>ADOPTED_AS</code> · <code>RESOLVES</code></span></div>
      <div><b>할 일</b><em>todos</em><span>→ <code>Action</code> + <code>CREATES</code> · <code>ASSIGNED_TO</code></span></div>
      <div><b>근거 구절</b><em>ev</em><span>→ 점에 붙는 <b>원문 속성</b> · 두 화면이 함께 쓰는 출처</span></div>
    </div>
    <p class="sub" style="margin-top:12px">관계 맵은 한 화면에서 읽히는 카드 수를 상한으로 두기 때문에 근거·조건·우려를 주장 안에 넣습니다. 온톨로지는 어떤 질문이든 받아야 해서 합치지 않고 모두 점으로 세웁니다.</p>
  </section>

  <section class="dsec"><div class="lb">GRAPH MODEL · 실제 데이터 구조</div><h2>점은 발언만을 뜻하지 않습니다</h2><p class="sub">피그마의 ‘노드 = 대상, 관계 = 서술어’ 원칙을 현재 데이터에 대입한 구조입니다. 원문은 출처이고, 그 안에서 구분한 의미와 참여자·파트·일정이 노드가 됩니다.</p>
    <div class="dgrid">
      <div class="dc"><div class="k">논의 · ${NODES.filter(n=>['Issue','Evidence','Concern','Question','Claim','Proposal','Condition'].includes(n.type)).length}개</div><h4>근거·제안·우려처럼 연결 가능한 의미</h4><p>하나의 발언에서 여러 의미를 분리할 수 있습니다. ‘사건’이라는 일반 유형은 없으며, 실제 관찰은 근거로, 이후 행동은 업무로 구분합니다. 주제는 현재 별도 노드가 아닌 묶음 속성입니다.</p></div>
      <div class="dc"><div class="k">사람과 맥락 · ${NODES.filter(n=>CTX.has(n.type)).length}개</div><h4>참여자 4 · 파트 3 · 일정 3</h4><p>참여자는 발언과 업무가 연결되는 독립 대상입니다. 파트는 소속과 담당 범위를, 일정은 후속 회의·발표·자문을 나타냅니다. 직책과 파트는 다른 정보입니다.</p><button class="inspect-graph" data-inspect="Participant">맵에서 참여자 보기 →</button></div>
      <div class="dc"><div class="k">결과 · ${NODES.filter(n=>['Decision','Conditional','Open','Action'].includes(n.type)).length}개</div><h4>결정·조건부·미결·업무</h4><p>합의 상태와 실행할 일을 분리합니다. 같은 결정에 근거·조건·남은 쟁점·담당 업무를 각각 연결하므로 결과만 읽을 때 사라지는 맥락을 되짚을 수 있습니다.</p><button class="inspect-graph" data-inspect="Action">맵에서 업무와 담당 보기 →</button></div>
    </div>
    <div class="dc graph-example"><div class="k">이 회의의 실제 연결 · 클릭하면 맵에서 확인</div><div class="example-nodes">${['t1.e3','t1.p1','t1.d','p.Lina','team.UX'].map(id=>`<button data-inspect-node="${id}"><span>${KO[BY[id].type]}</span>${esc(BY[id].label)}</button>`).join('')}</div><p>근거 — 뒷받침 → 제안 — 채택 → 결정<br>제안 — 발언자 → Lina — 소속 → UX<br>내용의 의미 관계와 사람 관계를 동시에 따라갈 수 있습니다. 뒷받침·소속 관계는 이 데이터에서 추론으로 표시됩니다.</p></div>
  </section>

  <section class="dsec"><div class="lb">MAP GUIDE</div><h2>맵의 점과 선은 이렇게 읽어요</h2>
    <p class="sub">회의 정보를 종류별로 나누고 서로의 관계를 연결한 구조를 ‘온톨로지’라고 불러요. 점은 정보, 선은 정보 사이의 연결이에요.</p>
    <div class="dgrid">
      <div class="dc"><div class="k">Node · 점</div><h4>하나의 발언, 결정, 할 일</h4><p>근거·제안·결정·업무 등을 하나씩 담아요. 노드를 누르면 왼쪽에서 내용과 연결된 정보를 읽을 수 있어요.</p></div>
      <div class="dc"><div class="k">Edge · 선</div><h4>서로 어떤 영향을 주었는지</h4><p>“이 근거가 제안을 뒷받침했다”, “이 결정에서 할 일이 생겼다” 같은 관계예요. 단순히 함께 언급됐다고 연결하지는 않아요.</p></div>
      <div class="dc"><div class="k">Color · 색</div><h4>정보의 종류를 구분해요</h4><p><span class="dot" style="background:#5f8dff"></span>근거·논의<br><span class="dot" style="background:#9a7bff"></span>우려·조건<br><span class="dot" style="background:#c9ccf0"></span>결론<br><span class="dot" style="background:#62e0ef"></span>업무</p></div>
      <div class="dc"><div class="k">Line · 선 모양</div><h4>직접 드러난 연결과 추론한 연결</h4><p>실선은 발언에서 확인된 관계, 점선은 맥락을 바탕으로 추론한 관계예요. 추론된 연결은 직접 확인된 사실과 구분해서 읽어주세요.</p></div>
    </div>
  </section>

  <section class="dsec"><div class="lb">POSITION</div><h2>점이 놓인 자리에도 의미가 있어요</h2>
    <p class="sub">시간, 정보의 역할, 연결 범위를 세 축으로 펼쳤어요. 맵을 회전하면 서로 다른 관점에서 구조를 볼 수 있어요.</p>
    <div class="axis"><div class="fig">${axesSVG()}</div><div class="rows">
      <div class="dc ax"><b style="background:#6d86d6">X</b><div><h4>언제 나온 이야기인가요?</h4><p>논의 노드의 근거 발언 시각을 X 좌표로 변환합니다. 맵을 회전하면 화면에서 보이는 방향은 달라져도 X축의 시간 의미는 유지됩니다.</p></div></div>
      <div class="dc ax"><b style="background:#8f78e6">Y</b><div><h4>논의에서 어떤 역할을 하나요?</h4><p>아래에는 근거와 질문, 그 위에는 쟁점과 제안, 위쪽에는 결론과 업무가 놓여요. Y 좌표는 정보의 역할을 나타내며 중요도 순위가 아닙니다. 참여자·파트·일정은 이 순서에서 제외하고 별도 맥락 영역에 놓습니다.</p></div></div>
      <div class="dc ax"><b style="background:#2fb5c6">Z</b><div><h4>얼마나 넓게 연결되어 있나요?</h4><p>논의 노드의 이웃 수 + 1.6 × (연결된 파트 수 − 1) + 0.8 × 이웃 발언자 수를 계산하고, 그 순위를 Z 좌표로 변환합니다. 화면의 앞뒤나 중요도를 고정적으로 뜻하지 않습니다.</p></div></div>
    </div>
  </section>

  <section class="dsec"><div class="lb">READ WITH CONTEXT</div><h2>답변을 더 정확하게 읽는 방법</h2><div class="dgrid">
    <div class="dc"><h4>근거 발언을 함께 읽어보세요</h4><p>현재 ${withQuote}개 노드에 원문이 연결되어 있어요. 모든 노드에 인용이 있는 것은 아니므로, 답변 아래에 표시된 발언과 시각을 함께 확인해보세요.</p></div>
    <div class="dc"><h4>추론은 확정된 사실과 구분해요</h4><p>현재 관계 ${EDGES.length}개 중 ${exp}개는 원문에서 확인한 연결(발언자 연결 ${byType.SAID_BY || 0}개 포함)이고, ${EDGES.length-exp}개는 추론된 연결이에요. 관계 경로를 펼치면 이 구분을 확인할 수 있어요.</p></div>
    <div class="dc"><h4>회의에서 찾지 못할 수도 있어요</h4><p>관련 내용을 찾지 못하면 그 사실을 안내해요. AI 연결에 실패하면 규칙 기반 탐색으로 대신하며, 이 경우 답변에 안내 문구가 표시돼요.</p></div>
  </div></section>

  <details class="reference"><summary>더 자세히 보기 · 정보 유형과 관계 목록</summary>
    <section class="dsec"><h2>어떤 정보가 담겨 있나요?</h2><p class="sub">지금 맵에 담긴 정보의 종류와 개수예요. 영문 이름은 관계 경로에 표시되는 이름과 같아요.</p>
      <div class="dgrid">${GROUPS_N.map(([en,ko,ts])=>`<div class="dc"><div class="k">${ko}</div>${ts.map(t=>`<p><span class="dot" style="background:${COLOR[t]}"></span><b>${KO[t]}</b> · ${cnt(t)}<br>${TYPE_DESC[t]}<br><code>${t}</code></p>`).join('')}</div>`).join('')}</div>
    </section>
    <section class="dsec"><h2>어떤 관계로 연결되나요?</h2><p class="sub">각 관계의 의미와 개수예요. KEY는 결론으로 이어지는 핵심 관계로, 맵에서 조금 더 밝게 표시해요.</p><div class="tbl">${edgeRows}</div></section>
  </details>
  </div>
  <p class="end-note">핵심은 원문 → 노드 → 관계 → 탐색 경로로 이어지는 출처의 연결입니다. 같은 맵을 결정의 이유, 담당 업무, 남은 쟁점 등 서로 다른 질문에 활용합니다.</p>

</div>`;
  $('#dclose').onclick = closeDesign;
  $('#design').querySelectorAll('[data-inspect]').forEach(b=>b.onclick=()=>{closeDesign();const n=NODES.find(n=>n.type===b.dataset.inspect);if(n)focusNode(n);});
  $('#design').querySelectorAll('[data-inspect-node]').forEach(b=>b.onclick=()=>{closeDesign();focusNode(BY[b.dataset.inspectNode]);});
}
function openDesign() {
  renderDesign(); $('#design').hidden = false; $('#design').scrollTop = 0;
  if (location.hash !== '#design') history.pushState(null, '', '#design');
  $('#dclose').focus();
}
function closeDesign() {
  if ($('#design').hidden) return;
  $('#design').hidden = true;
  if (location.hash === '#design') history.back();
  $('#dopen').focus();
}
$('#dopen').onclick = openDesign;
/* UI 숨기기 — 3D 와 질문창만 남는다. 캔버스는 넓어진 만큼 다시 잡아 준다 */
function bare(on) {
  document.body.classList.toggle('bare', on);
  requestAnimationFrame(resize);
  setTimeout(resize, 260);
}
$('#dopen2').onclick = openDesign;
document.querySelectorAll('.axes button').forEach(b => { b.onclick = () => startTour(b.dataset.tour); });
$('#viewbar').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setView(b.dataset.view); });
addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#design').hidden) return closeDesign();
  if (e.key === 'Escape' && TOUR) return stopTour();
  if (/^(INPUT|TEXTAREA)$/.test((document.activeElement || {}).tagName || '') || !$('#design').hidden) return;
  const ax = { x: 'x', y: 'y', z: 'z', ㅌ: 'x', ㅛ: 'y', ㅋ: 'z' }[e.key.toLowerCase()];
  if (ax) return startTour(ax);
  if ((e.key === 'h' || e.key === 'H' || e.key === 'ㅗ') && !/^(INPUT|TEXTAREA)$/.test((document.activeElement || {}).tagName || '')
      && $('#design').hidden) bare(!document.body.classList.contains('bare'));
});
addEventListener('popstate', () => { if (location.hash !== '#design') $('#design').hidden = true; else if ($('#design').hidden) openDesign(); });
if (location.hash === '#design') setTimeout(openDesign, 0);

bare(true);        /* 들어오면 3D 와 질문창만 — 왼쪽 UI 는 버튼이나 H 로 연다 */
resize();
requestAnimationFrame(frame);
{ const q0 = new URLSearchParams(location.search).get('q');   /* ?q=질문 — 그 질문으로 바로 탐색 */
  const ready = INTRO.skip ? 400 : PT_AT + PT_SPAN + PT_DUR + 500;   /* 점이 다 떠오르고 자리를 잡을 때까지 */
  if (q0) setTimeout(() => { $('#askq').value = q0; ask(q0); }, ready);
  /* 처음 들어오면 영상부터 — 전시장에서 아무도 건드리지 않아도 혼자 시작한다.
     로딩 중에 누가 이미 만졌으면(lastInput 이 찍혔으면) 가만히 둔다 */
  else setTimeout(() => { if (!lastInput) demoOn(); }, ready); }
</script>
